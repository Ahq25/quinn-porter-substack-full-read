<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:40px;font-weight:700}.big{font-size:58px}.label{font-size:30px}.small{font-size:25px}.box{fill:white;stroke:#111;stroke-width:3}.line{stroke:#111;stroke-width:3;fill:none}.arrow{marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<text x="700" y="70" text-anchor="middle" class="title">Point reflection in the oriented PERIOD unit</text>
<text x="700" y="155" text-anchor="middle" class="big">p  |  erio  |  d</text>
<path d="M700 180 L300 300" class="line arrow"/><path d="M700 180 L700 300" class="line arrow"/><path d="M700 180 L1100 300" class="line arrow"/>
<rect x="70" y="305" width="430" height="190" rx="18" class="box"/><rect x="485" y="305" width="430" height="190" rx="18" class="box"/><rect x="900" y="305" width="430" height="190" rx="18" class="box"/>
<text x="285" y="355" text-anchor="middle" class="label">Reflection only</text><text x="285" y="415" text-anchor="middle" class="big">ǝɹᴉo</text><text x="285" y="465" text-anchor="middle" class="small">full-word legibility fails</text>
<text x="700" y="355" text-anchor="middle" class="label">Reversal only</text><text x="700" y="415" text-anchor="middle" class="big">oire</text><text x="700" y="465" text-anchor="middle" class="small">full-word legibility fails</text>
<text x="1115" y="355" text-anchor="middle" class="label">Point reflection</text>
<g transform="translate(1115 418) rotate(180)"><text text-anchor="middle" class="big">erio</text></g>
<text x="1115" y="465" text-anchor="middle" class="small">opposite orientation is legible</text>
<text x="700" y="570" text-anchor="middle" class="label">The boundary carriers stay fixed while their relational identities invert.</text>
<text x="700" y="635" text-anchor="middle" class="big">p → d     ·     d → p</text>
<text x="700" y="700" text-anchor="middle" class="small">Identity inversion without positional exchange</text>
</svg>